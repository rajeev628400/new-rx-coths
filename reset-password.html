<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Set a new RX CLOTHS account password.">
  <title>Reset password | RX CLOTHS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/supabase-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="RX CLOTHS home">RX <span>CLOTHS</span></a>
    <nav class="primary-navigation" aria-label="Main navigation"><a href="men.html">Men</a><a href="women.html">Women</a><a href="kids.html">Kids</a></nav>
  </header>
  <main id="main-content" class="page-main auth-main">
    <p class="eyebrow">Your account</p><h1>Set a new password</h1>
    <section class="story-panel auth-panel">
      <form class="auth-form" data-auth-password-update>
        <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm new password<input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" required></label>
        <button class="button button-dark" type="submit">Update password</button>
      </form>
      <p class="auth-status" data-auth-status role="status" aria-live="polite">Checking password reset link…</p>
      <a class="text-link" href="login.html">Return to log in</a>
    </section>
  </main>
  <footer class="site-footer"><a class="wordmark footer-wordmark" href="index.html">RX <span>CLOTHS</span></a><p>© <span data-current-year>2026</span> RX CLOTHS.</p></footer>
</body>
</html>
